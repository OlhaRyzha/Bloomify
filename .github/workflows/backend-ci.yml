name: Backend CI

on:
  push:
    branches: [main, development]
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-insecure-secret-key-for-testing-only"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      DJANGO_ENABLE_API_DOCS: "true"
      LIQPAY_PUBLIC_KEY: "sandbox_public_key"
      LIQPAY_PRIVATE_KEY: "sandbox_private_key"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy .

      - name: Apply migrations
        working-directory: backend
        run: uv run python manage.py migrate

      - name: Check for uncommitted model changes
        working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Check API contract drift
        run: |
          make generate-api-types
          if ! git diff --exit-code frontend/src/types/api.generated.ts; then
            echo "❌ API types are out of sync. Run 'make generate-api-types' locally and commit changes."
            exit 1
          fi

      - name: Run tests with coverage
        working-directory: backend
        run: uv run coverage run manage.py test --verbosity=2

      - name: Coverage report (fail under 80%)
        working-directory: backend
        run: uv run coverage report

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start Django server for load test
        working-directory: backend
        run: |
          uv run python manage.py runserver 8000 &
          echo $! > /tmp/django.pid
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/products && break || sleep 1
          done

      - name: LiqPay callback smoke (load test)
        run: k6 run backend/load_tests/liqpay-callback-smoke.js

      - name: Stop Django server
        if: always()
        run: kill $(cat /tmp/django.pid) 2>/dev/null || true
