name: Subscription Audit

on:
  schedule:
    # Every day at 06:00 UTC (09:00 Kyiv)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Skip on forks and when the production DB secret is not configured
    if: github.repository_owner == 'OlhaRyzha'

    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "audit-read-only-run"
      DJANGO_ALLOWED_HOSTS: "localhost"
      DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
      POSTGRES_SSLMODE: "require"

    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::AUDIT_DATABASE_URL secret is not set — skipping audit."
            echo "SKIP_AUDIT=1" >> "$GITHUB_ENV"
          fi

      - name: Install uv
        if: env.SKIP_AUDIT != '1'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        if: env.SKIP_AUDIT != '1'
        working-directory: backend
        run: uv sync

      - name: Run subscription audit
        if: env.SKIP_AUDIT != '1'
        working-directory: backend
        run: |
          uv run python manage.py audit_subscriptions --full --format json | tee audit.json

      - name: Fail if audit found problems
        if: env.SKIP_AUDIT != '1'
        working-directory: backend
        run: |
          PASSED=$(python3 -c "import json; print(json.load(open('audit.json'))['passed'])")
          if [ "$PASSED" != "True" ]; then
            echo "::error::Subscription audit FAILED — check stuck payments, duplicates, or refund anomalies in the job log above."
            exit 1
          fi
          echo "✓ Subscription audit passed."
