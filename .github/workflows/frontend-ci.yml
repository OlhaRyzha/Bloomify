name: Frontend CI

on:
  push:
    branches: [main, development]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_MEDIA_HOST: ${{ vars.NEXT_PUBLIC_MEDIA_HOST }}
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Lint
        run: make frontend-lint

      - name: Type check
        run: make frontend-typecheck

      - name: Unit tests
        run: make frontend-test-unit

      - name: Coverage
        run: make frontend-test-coverage

      - name: Check dependencies
        run: make frontend-check-deps

  build:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_MEDIA_HOST: ${{ vars.NEXT_PUBLIC_MEDIA_HOST }}
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Build frontend
        run: make frontend-build

      - name: Performance budget
        run: cd frontend && npm run performance:budget

  e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_MEDIA_HOST: http://127.0.0.1:8010
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      PLAYWRIGHT_API_URL: http://127.0.0.1:8010
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Build frontend for E2E
        run: make frontend-build

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start E2E servers
        run: |
          cd frontend
          mkdir -p e2e-server-logs

          node e2e/mock-api/server.mjs > e2e-server-logs/mock-api.log 2>&1 &
          echo $! > /tmp/mock-api.pid

          npm run start -- --hostname 127.0.0.1 --port 3100 > e2e-server-logs/next-start.log 2>&1 &
          echo $! > /tmp/next.pid

          wait_for_url() {
            url=$1
            echo "Waiting for $url"
            for attempt in $(seq 1 90); do
              if curl --fail --location --silent --show-error --max-redirs 5 "$url" >/dev/null; then
                echo "$url is ready"
                return 0
              fi
              sleep 2
            done
            echo "$url did not become ready in time"
            return 1
          }

          wait_for_url "$PLAYWRIGHT_API_URL/site/languages"
          wait_for_url "$PLAYWRIGHT_BASE_URL/uk/sign-in"

      - name: E2E smoke tests
        run: cd frontend && PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test e2e/app-smoke.spec.ts

      - name: E2E visual regression tests
        id: visual
        run: cd frontend && PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test e2e/visual-responsive.spec.ts
        continue-on-error: true

      - name: Update visual snapshots if stale
        if: steps.visual.outcome == 'failure'
        run: |
          cd frontend && PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test e2e/visual-responsive.spec.ts --update-snapshots
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add e2e/visual-responsive.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "Snapshots unchanged after update — failure is not a rendering drift."
          else
            git commit -m "chore: update visual regression snapshots [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "::warning::Visual snapshots were updated and pushed to the branch. Re-run this job to verify the new baseline."
          fi
          exit 1

      - name: E2E accessibility tests
        run: cd frontend && PLAYWRIGHT_SKIP_WEBSERVER=1 npm run test:e2e:a11y

      - name: Stop E2E servers
        if: always()
        run: kill $(cat /tmp/mock-api.pid) $(cat /tmp/next.pid) 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Upload E2E server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-server-logs
          path: frontend/e2e-server-logs
          if-no-files-found: ignore
