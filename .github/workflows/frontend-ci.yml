name: Frontend CI

on:
  push:
    branches: [main, development]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_MEDIA_HOST: http://127.0.0.1:8010
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Lint
        run: make frontend-lint

      - name: Type check
        run: make frontend-typecheck

      - name: Unit tests
        run: make frontend-test-unit

      - name: Coverage
        run: make frontend-test-coverage

  build:
    runs-on: ubuntu-latest
    needs: check
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_MEDIA_HOST: http://127.0.0.1:8010
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Build frontend
        run: make frontend-build

      - name: Performance budget
        run: cd frontend && npm run performance:budget

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          include-hidden-files: true

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
      NEXT_PUBLIC_MEDIA_HOST: http://127.0.0.1:8010
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      PLAYWRIGHT_API_URL: http://127.0.0.1:8010
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: E2E smoke and visual tests
        run: make frontend-test-e2e

      - name: E2E accessibility tests
        run: make frontend-test-e2e-a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
