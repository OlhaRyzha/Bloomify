{% extends "admin/base_site.html" %}
{% load i18n %}

{% block userlinks %}
  <form action="{% url 'set_language' %}" method="post" style="display:inline-flex;align-items:center;gap:6px;margin-right:12px;">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <label for="admin-language-switcher" class="sr-only">{% trans "Language" %}</label>
    <select id="admin-language-switcher" name="language" onchange="this.form.submit()" style="border-radius:9999px;padding:2px 8px;">
      {% get_current_language as CURRENT_LANGUAGE %}
      {% get_available_languages as AVAILABLE_LANGUAGES %}
      {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
        <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANGUAGE %}selected{% endif %}>{{ lang_name }}</option>
      {% endfor %}
    </select>
  </form>
  {{ block.super }}
{% endblock %}
