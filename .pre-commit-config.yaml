repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: black (backend)
        files: ^backend/.*\.py$
        args: ["--config", ".black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
        name: ruff (backend)
        files: ^backend/.*\.py$
        args: ["--fix", "--config", "ruff.toml"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (backend)
        files: ^backend/.*\.py$
        entry: bash -c 'PYTHONPATH=backend DJANGO_SETTINGS_MODULE=config.settings mypy --config-file mypy.ini "$@"' --
        additional_dependencies:
          - django-stubs
          - djangorestframework-stubs
          - django
          - djangorestframework
          - djangorestframework-simplejwt
          - django-cors-headers
          - django-crispy-forms
          - django-unfold
          - django-parler
          - drf-spectacular
          - pydantic-settings
          - psycopg[binary]
          - types-redis

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (frontend)
        entry: make frontend-lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|jsx|ts|tsx)$

      - id: frontend-typecheck
        name: typecheck (frontend)
        entry: make frontend-typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: frontend-unit-tests
        name: unit tests (frontend)
        entry: make frontend-test-unit
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: frontend-e2e-tests
        name: e2e tests (frontend)
        entry: make frontend-test-e2e
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
        stages: [pre-push]
